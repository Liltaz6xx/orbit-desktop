name: Draft Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/windows.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build release ZIP
        run: python scripts/build_release.py --tag "$env:GITHUB_REF_NAME"
      - name: Build Windows x64 installer
        run: ./scripts/build_installer.ps1 -InstallCompiler -Tag "$env:GITHUB_REF_NAME"
      - name: Verify installation and upgrade
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          ./scripts/test_installer.ps1 -Installer "dist/ORBIT-Desktop-$version-Windows-x64-Setup.exe"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = $env:GITHUB_REF_NAME.Substring(1)
          $arguments = @('release', 'create', $env:GITHUB_REF_NAME, '--verify-tag', '--draft',
            '--title', "ORBIT Desktop $release", '--notes-file', 'RELEASE_NOTES.md')
          if ($release.Contains('-')) { $arguments += '--prerelease' }
          $arguments += (Get-ChildItem dist -File).FullName
          gh @arguments
